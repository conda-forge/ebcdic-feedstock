schema_version: 1

context:
  version: 2.0.1
  build_number: '0'

package:
  name: ebcdic
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/e/ebcdic/ebcdic-${{ version }}.tar.gz
  sha256: 3a1bedfbeee76cab2d7e4de62409ac015cd7afb25d590fe1546105c32a065cf1

build:
  number: 0
  noarch: python
  script: cd ${{ name }}; ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - flit-core
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - ebcdic
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: BSD-2-Clause
  license_file: LICENSE.txt
  summary: Build mapping files derived from Java Charsets which can be processed by Pythons gencodec.py.
  description: |
    Build mapping files derived from Java Charsets which can be processed
    by Python's gencodec.py.
  homepage: https://github.com/roskakori/CodecMapper
  repository: https://github.com/roskakori/CodecMapper
  documentation: https://github.com/roskakori/CodecMapper

extra:
  recipe-maintainers:
    - jan-janssen
